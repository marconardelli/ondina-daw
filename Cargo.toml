[workspace]
resolver = "2"
members = ["crates/core", "crates/dsp", "crates/engine", "crates/studio", "crates/app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hound = "3.5"
midly = "0.5"
cpal = "0.15"
midir = "0.10"
symphonia = { version = "0.5", features = ["all"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
eframe = "0.29"
rfd = "0.15"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
